[project]
name = "volume-control"
version = "1.0.0"
description = "Volume control system for home automation"
requires-python = ">=3.11"
dependencies = [
    "lirc",
    "evdev",
    "requests",
    "qlcplus @ git+ssh://git@github.com/joshlebed/qlc-config.git",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# src/ is not a package (flat modules imported by name), so put it on the path.
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
